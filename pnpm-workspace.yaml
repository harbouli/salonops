packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  argon2: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.26'
  - '@expo/metro-runtime@57.0.16'
  - '@expo/ui@57.0.19'
  - expo-asset@57.0.18
  - expo-constants@57.0.19
  - expo-image-picker@57.0.19
  - expo-router@57.0.22
  - expo@57.0.24

onlyBuiltDependencies:
  - argon2
  - esbuild

overrides:
  '@types/react': '~18.3.12'
  '@types/react-dom': '~18.3.1'
