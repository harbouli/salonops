name: CD - Continuous Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-api:
    name: Build & Push API Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-deploy-web:
    name: Build Web Applications (Admin & Client Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Approve native build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin Dashboard
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.salonops.ma' }}
        run: pnpm --filter @salonops/admin-dashboard build

      - name: Build Client Web
        env:
          VITE_API_URL: ${{ secrets.PRODUCTION_API_URL || 'https://api.salonops.ma' }}
        run: pnpm --filter @salonops/client-web build

      - name: Upload Admin Dashboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-dashboard-dist
          path: apps/admin-dashboard/dist
          retention-days: 7

      - name: Upload Client Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: client-web-dist
          path: apps/client-web/dist
          retention-days: 7

  mobile-release-check:
    name: Staff Mobile (Expo EAS Build Ready)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Approve native build scripts
        run: pnpm approve-builds --all

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Expo Mobile App
        run: pnpm --filter @salonops/staff-mobile typecheck

      - name: Setup Expo EAS CLI
        if: env.EXPO_TOKEN != ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
