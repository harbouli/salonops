services:
  postgres:
    image: postgres:16-alpine
    container_name: salonops-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salonops
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: salonops-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: salonops-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"      # MinIO S3 API
      - "9001:9001"      # MinIO Web Console UI
    volumes:
      - minio_dev_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: salonops-minio-init-dev
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/salonops-media;
      /usr/bin/mc anonymous set download myminio/salonops-media;
      echo 'MinIO salonops-media bucket created and configured.';
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: salonops-api-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/salonops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-key-for-moroccan-salon-platform
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "*"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: salonops-media
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  admin-dashboard:
    build:
      context: .
      dockerfile: apps/admin-dashboard/Dockerfile.dev
    container_name: salonops-admin-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./apps/admin-dashboard:/app/apps/admin-dashboard
      - /app/apps/admin-dashboard/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      - api

  client-web:
    build:
      context: .
      dockerfile: apps/client-web/Dockerfile.dev
    container_name: salonops-client-dev
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      VITE_API_URL: http://localhost:4000
    volumes:
      - ./apps/client-web:/app/apps/client-web
      - /app/apps/client-web/node_modules
      - ./packages:/app/packages
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:
